name: ClawHub Skill Sync

# Manual only, by standing rule: a skill is never published without explicit
# approval. A push must not reach ClawHub on its own, so there is no push: or
# pull_request: trigger here. Run it from the Actions tab with dry_run=false
# when the change has been approved.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — do not publish to ClawHub"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dry-run:
    if: github.repository_owner == 'j3ffyang' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Checkout ClawHub CLI
        uses: actions/checkout@v7.0.1
        with:
          repository: openclaw/clawhub
          ref: v0.23.3
          path: clawhub-source

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Preview skill publishes
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: python3 scripts/clawhub_publish.py --dry-run

  publish:
    if: github.repository_owner == 'j3ffyang' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Checkout ClawHub CLI
        uses: actions/checkout@v7.0.1
        with:
          repository: openclaw/clawhub
          ref: v0.23.3
          path: clawhub-source

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Write ClawHub config
        env:
          CLAWHUB_TOKEN: ${{ secrets.clawhub_token }}
        run: |
          if [[ -z "$CLAWHUB_TOKEN" ]]; then
            echo "::error::Real skill publishes need secrets.clawhub_token."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(
              json.dumps({"registry": "https://clawhub.ai", "token": os.environ["CLAWHUB_TOKEN"]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(path)
          PY
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Publish skills to ClawHub
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: python3 scripts/clawhub_publish.py
