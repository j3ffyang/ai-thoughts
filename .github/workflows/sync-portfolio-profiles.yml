name: Sync Portfolio Profiles

on:
  push:
    branches: [main]
    paths:
      - "PORTFOLIO.md"
      - "scripts/portfolio_template.md"
      - "scripts/gen_portfolio.py"
      - ".github/workflows/sync-portfolio-profiles.yml"
  workflow_dispatch: {}

concurrency:
  group: sync-portfolio-profiles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'j3ffyang/ai-thoughts'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to profile repo
        env:
          SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::PROFILE_SYNC_TOKEN secret not set."
            echo "Create a PAT with write access to both accounts and add it as the PROFILE_SYNC_TOKEN repository secret."
            exit 1
          fi

          for repo in j3ffyang/j3ffyang; do
            curl -sS -f \
              -X POST \
              -H "Authorization: Bearer ${SYNC_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d '{"event_type": "sync-portfolio"}'
            echo "Dispatched sync-portfolio to ${repo}"
          done
