# Single source of truth for the README index.
#
# The READMEs (README.md / README_zh.md) are GENERATED from this file by:
#     python scripts/gen_readmes.py
#
# To add or update an article:
#   1. Drop the article file into docs/ (follow the YYMMDD-slug naming).
#   2. Add a row here with: section, status, links (label + path + lang),
#      desc_en (only needed if any link is lang: en) and desc_zh.
#   3. Run the generator and commit the regenerated READMEs.
#
# - status: "published"  -> article table section
#           "draft"      -> metadata for Drafts & Working Notes
# - Draft rows must also use `section: drafts` — the generator routes rows by
#   `section`, not by `status`.
# - links[].lang: "en" -> appears in README.md; "zh" -> appears only in README_zh.md
#   (README_zh.md keeps ALL rows; README.md keeps rows with at least one en link.)
# - Multiple links in one row are rendered joined by " · " (used to group drafts).

